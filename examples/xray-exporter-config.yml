# Nothing is built in: every host and resolver below is an example. Drop what
# you do not measure and add your own; an empty or absent file fails at startup.
dns_probe_domain: example.com      # queried by DoH/DoT probes
dns_upstream: 1.1.1.1:53           # forwarded to by the tunnel DNS inbound
targets:
  - host: youtube.com
  - host: netflix.com
  - host: gosuslugi.ru
dns_resolvers:
  - name: cloudflare
    doh_url: https://cloudflare-dns.com/dns-query
    dot_host: one.one.one.one
  - name: quad9
    doh_url: https://dns.quad9.net/dns-query

# Omit this block to read full xray client configs from XRAY_CONFIG_DIR.
# xray_config_source:
#   type: remnawave
#   url: https://panel.example.com/api/sub/<shortUuid>
#   refresh: 5m

# Omit this block to send no traffic outside a tunnel. An empty block
# (`reachability: {}`) only looks up the network the host is on.
# reachability:
#   controls:
#     https:
#       - { name: ya,     host: ya.ru,      class: domestic }
#       - { name: google, host: google.com, class: foreign }
#       - { name: panel,  host: "example.com:8443", class: foreign }  # a port is optional
#     tcp:
#       - { name: cf, addr: "1.1.1.1:443", class: foreign }
#   entry_tcp: true

# Omit these blocks to probe no UDP or plain TCP targets. `name` is the target
# label, so names must be unique across both blocks.
# udp_targets:
#   - name: tg-stun-1
#     kind: stun
#     addr: "203.0.113.10:3478"   # a Telegram call endpoint, or any STUN server
#     count: 20                   # default; 1..1000, 0 means the default
#     spacing: 100ms              # default; 1ms..1s
#     timeout: 15s                # default: PROBE_TIMEOUT (10s); must exceed count x spacing
# tcp_targets:
#   - name: mtproto-dc4
#     addr: "203.0.113.20:443"

# Omit this block to probe only the idle pass. The URL must be the file itself:
# the exporter does not follow redirects.
# udp_under_load:
#   url: https://mirror.example.com/20mb.bin

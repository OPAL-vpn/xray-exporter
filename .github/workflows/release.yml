name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/opal-vpn/xray-exporter:${{ github.ref_name }}
            ghcr.io/opal-vpn/xray-exporter:latest
          build-args: |
            VERSION=${{ github.ref_name }}

  release:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # The annotated tag's message becomes the release body, so the tag
          # object has to be in the clone, not just the commit it points at.
          fetch-depth: 0
      - name: publish the release entry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          {
            # contents:body drops the subject and the SSH signature; a signed
            # tag's %(contents) would paste the signature into the release body.
            git tag -l --format='%(contents:body)' "${tag}"
            printf '\n## Container image\n\n'
            printf '```\ndocker pull %s:%s\n```\n\n' "${image}" "${tag}"
            printf -- '- platforms: `linux/amd64`, `linux/arm64`\n'
            printf -- '- multi-arch manifest digest: `%s`\n' "${DIGEST}"
          } > release-notes.md
          gh release create "${tag}" --title "${tag}" --notes-file release-notes.md --latest \
            || gh release edit "${tag}" --notes-file release-notes.md --latest
